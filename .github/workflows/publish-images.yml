name: Publish add-on images

on:
  push:
    branches:
      - main
    paths:
      - "alpr_ru/config.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: aarch64
            platform: linux/arm64
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Read add-on version
        id: version
        shell: bash
        run: |
          VERSION=$(python - <<'PY'
          import re
          text = open('alpr_ru/config.yaml', encoding='utf-8').read()
          match = re.search(r'^version:\s*["\']?([^"\'\n]+)', text, re.M)
          if not match:
              raise SystemExit('version not found')
          print(match.group(1).strip())
          PY
          )
          echo "value=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: ./alpr_ru
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=ghcr.io/home-assistant/${{ matrix.arch }}-base:3.24
            BUILD_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-alpr-ru:${{ steps.version.outputs.value }}
            ghcr.io/${{ github.repository_owner }}/${{ matrix.arch }}-alpr-ru:latest
          labels: |
            org.opencontainers.image.title=Home Assistant ALPR-RU
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
